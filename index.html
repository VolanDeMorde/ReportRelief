
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportRelief | Professional Student Reports in Seconds</title>
    <meta name="description" content="ReportRelief helps teachers write accurate, personalised student reports in seconds with AI, from their own observations. UK, US and IB curricula, 15+ languages, bulk CSV import.">
    <link rel="canonical" href="https://reportrelief.app/">

    <!-- Social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ReportRelief">
    <meta property="og:title" content="ReportRelief | Professional Student Reports in Seconds">
    <meta property="og:description" content="Write accurate, personalised student reports in seconds with AI, from your own observations.">
    <meta property="og:url" content="https://reportrelief.app/">
    <meta name="twitter:card" content="summary">

    <!-- S12: Apply dark class synchronously before first paint to eliminate dark-mode FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rb-dark-mode');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' width='100' height='100'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>R</text></svg>" type="image/svg+xml">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ReportRelief">
    <link rel="apple-touch-icon" href="/icon.svg">

    <style>
        :root {
            scroll-behavior: auto !important;
        }

        body {
            font-family: 'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            text-rendering: optimizeSpeed;
            -webkit-font-smoothing: antialiased;
            overflow-y: scroll;
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh feel in app mode */
        }
        
        .selectable { user-select: text; }
        
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(231,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(255,100%,94%,1) 0, transparent 50%);
        }

        .dark .bg-mesh {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, hsla(231,100%,10%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(255,100%,10%,1) 0, transparent 50%);
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
            border: 3px solid transparent;
            background-clip: content-box;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        @media print {
            .print-hidden { display: none !important; }
            body { background: white !important; color: black !important; }
            .bg-mesh { display: none; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div class="bg-mesh"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
